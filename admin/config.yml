collections:
  - name: "home"
    label: "Página de Inicio"
    files:
      - file: "content/destacados.json"
        label: "Sección Destacados (Index)"
        name: "destacados"
        fields:
          - label: "Lista de Productos Destacados"
            name: "productos"
            widget: "list"
            fields:
              - {label: "Nombre del Producto", name: "name", widget: "string"}
              - {label: "Precio Actual", name: "price", widget: "string"}
              - {label: "Precio Anterior (Opcional, tachado)", name: "old_price", widget: "string", required: false}
              - {label: "Imagen del Producto", name: "image", widget: "image"}
