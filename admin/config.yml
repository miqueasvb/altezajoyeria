collections:
  - name: "destacados_home"
    label: "Destacados"
    files:
      - name: "destacados_json"
        label: "Lista de Productos Destacados"
        file: "content/destacados.json"
        fields:
          - label: "Productos"
            name: "productos"
            widget: "list"
            summary: '{{fields.name}}'
            fields:
              - { label: "Título del Producto", name: "name", widget: "string" }
              - { label: "Precio Actual", name: "price", widget: "string" }
              - { label: "Precio Anterior (Tachado, opcional)", name: "old_price", widget: "string", required: false }
              - { label: "Imagen", name: "image", widget: "image" }
