backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "secciones_home"
    label: "Página Principal (www.altezajoyeria.com.ar)"
    files:
      - name: "anuncios_topbar"
        label: "Barra Superior de Anuncios (Marquesina)"
        file: "content/anuncios.json"
        fields:
          - label: "Mensajes de la Marquesina"
            name: "anuncios"
            widget: "list"
            summary: '{{fields.texto}}'
            fields:
              - { label: "Texto del Mensaje", name: "texto", widget: "string" }
              - label: "Icono"
                name: "icono"
                widget: "select"
                options:
                  - { label: "Tarjeta de Crédito", value: "tarjeta" }
                  - { label: "Descuento / Joya", value: "descuento" }
                  - { label: "Envío / Camión", value: "envio" }

      - name: "destacados_json"
        label: "Destacados"
        file: "content/destacados.json"
        fields:
          - label: "Destacados"
            name: "productos"
            widget: "list"
            summary: '{{fields.name}}'
            fields:
              - { label: "Título del Producto", name: "name", widget: "string" }
              - { label: "Precio Actual", name: "price", widget: "string" }
              - { label: "Precio Anterior (Tachado, opcional)", name: "old_price", widget: "string", required: false }
              - { label: "Imagen", name: "image", widget: "image" }

      - name: "novedades_json"
        label: "Novedades"
        file: "content/novedades.json"
        fields:
          - label: "Novedades"
            name: "productos"
            widget: "list"
            summary: '{{fields.name}}'
            fields:
              - { label: "Título del Producto", name: "name", widget: "string" }
              - { label: "Precio Actual", name: "price", widget: "string" }
              - { label: "Precio Anterior (Tachado, opcional)", name: "old_price", widget: "string", required: false }
              - { label: "Imagen", name: "image", widget: "image" }

  - name: "catalogo"
    label: "Catálogo General"
    files:
      - file: "content/productos.json"
        label: "Lista de Productos del Catálogo"
        name: "productos_file"
        fields:
          - label: "Productos del Catálogo"
            name: "productos"
            widget: "list"
            summary: '{{fields.nombre}} - {{fields.tipo}}'
            fields:
              - { label: "Nombre del Producto", name: "nombre", widget: "string" }
              - { label: "Precio ($)", name: "precio", widget: "number", value_type: "int" }
              - { label: "Imagen", name: "imagen", widget: "image" }
              - label: "Material"
                name: "material"
                widget: "select"
                required: false
                options:
                  - { label: "Plata 925", value: "plata" }
                  - { label: "Oro 18k", value: "oro" }
                  - { label: "Plata y Oro", value: "plata-oro" }
                  - { label: "Ninguno (Para Relojes)", value: "" }
              - label: "Tipo de Producto"
                name: "tipo"
                widget: "select"
                options:
                  - { label: "Anillos", value: "anillos" }
                  - { label: "Aros", value: "aros" }
                  - { label: "Cadenas", value: "cadenas" }
                  - { label: "Pulseras", value: "pulseras" }
                  - { label: "Dijes y Colgantes", value: "dijes" }
                  - { label: "Cintillos", value: "cintillos" }
                  - { label: "Alianzas", value: "alianzas" }
                  - { label: "Relojería", value: "relojes" }
              - label: "Género"
                name: "genero"
                widget: "select"
                required: false
                options:
                  - { label: "Dama", value: "dama" }
                  - { label: "Caballero", value: "caballero" }
              - label: "Detalle / Subcategoría"
                name: "sub"
                widget: "select"
                required: false
                options:
                  - { label: "Con piedras", value: "con-piedras" }
                  - { label: "Sin piedras", value: "sin-piedras" }
                  - { label: "Abridores", value: "abridores" }
                  - { label: "Argollas", value: "argollas" }
                  - { label: "Esclavas", value: "esclavas" }
                  - { label: "Cierre rosca", value: "cierre-rosca" }
              - label: "Marca (Solo Relojes)"
                name: "marca"
                widget: "select"
                required: false
                options:
                  - { label: "Citizen", value: "citizen" }
                  - { label: "Casio", value: "casio" }
                  - { label: "Festina", value: "festina" }
                  - { label: "Swatch", value: "swatch" }
                  - { label: "Tissot", value: "tissot" }
                  - { label: "Seiko", value: "seiko" }
                  - { label: "Cat", value: "cat" }
                  - { label: "Orient", value: "orient" }
                  - { label: "Tommy Hilfiger", value: "tommy-hilfiger" }
                  - { label: "Tressa", value: "tressa" }
                  - { label: "Election", value: "election" }
                  - { label: "Lacoste", value: "lacoste" }
                  - { label: "Calvin Klein", value: "calvin-klein" }
                  - { label: "Knock Out", value: "knock-out" }
