collections:
  - name: "destacados"
    label: "Productos Destacados (Index)"
    folder: "content/destacados" # O la ruta donde guardes tus archivos de contenido
    create: true
    fields:
      - {label: "Nombre del Producto", name: "title", widget: "string"}
      - {label: "Precio Actual", name: "price", widget: "string"}
      - {label: "Precio Anterior (Opcional)", name: "old_price", widget: "string", required: false}
      - {label: "Imagen", name: "image", widget: "image"}
