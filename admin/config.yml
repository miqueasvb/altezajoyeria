backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "destacados_home"
    label: "✨ Destacados del Index"
    files:
      - name: "alteza_datos"
        label: "Lista de Productos Destacados"
        file: "_data/alteza_destacados.yml"
        fields:
          - label: "Productos Destacados"
            name: "productos_destacados_list"
            widget: "list"
            summary: '{{fields.titulo}}'
            fields:
              - { label: "Título del Producto", name: "titulo", widget: "string" }
              - { label: "Precio Actual", name: "precio", widget: "string" }
              - { label: "Precio Anterior (Tachado, opcional)", name: "precio_anterior", widget: "string", required: false }
              - { label: "Imagen", name: "imagen", widget: "image" }
